<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C3D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Geometric Vault / Diamond Emblem -->
  <g transform="translate(256, 256)">
    <!-- Outer Octagon ring -->
    <polygon points="0,-160 113,-113 160,0 113,113 0,160 -113,113 -160,0 -113,-113" 
             fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>

    <!-- Concentric diamond -->
    <polygon points="0,-130 130,0 0,130 -130,0" 
             fill="#0B132B" stroke="url(#emeraldGrad)" stroke-width="6"/>

    <!-- Emerald Glow Polygon -->
    <polygon points="0,-100 100,0 0,100 -100,0" 
             fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Dynamic Wealth Growth Bars / Geometric R Symbol -->
    <path d="M -50,55 L -50,-40 C -50,-65 -20,-75 10,-60 C 35,-48 45,-20 30,10 L -15,55 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Central Node -->
    <circle cx="0" cy="-25" r="14" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-25" r="7" fill="#0B132B"/>

    <!-- Ascending Emerald Trend Arrow -->
    <path d="M -30,25 L 5, -10 L 45,-50 M 20,-50 L 45,-50 L 45,-25" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>